<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Shivangi ❤️</title>

<style>
body {
  margin: 0;
  text-align: center;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  overflow: hidden;
  color: white;
}

h1 {
  margin-top: 120px;
  font-size: 40px;
  padding: 0 20px;
}

button {
  padding: 15px 35px;
  font-size: 20px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  position: absolute;
  transition: 0.2s ease;
}

.yes {
  background-color: #ff4d6d;
  color: white;
}

.no {
  background-color: white;
  color: #ff4d6d;
}

#yesBtn {
  left: 40%;
  top: 55%;
}

#noBtn {
  left: 55%;
  top: 55%;
}

/* Floating hearts */
.heart {
  position: absolute;
  color: rgba(255,255,255,0.7);
  font-size: 20px;
  animation: float 8s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh); }
  100% { transform: translateY(-10vh); }
}

/* Confetti */
.confetti {
  position: absolute;
  font-size: 25px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  0% { transform: translateY(-10vh); opacity: 1; }
  100% { transform: translateY(100vh); opacity: 0; }
}
</style>
</head>

<body>

<h1 id="question">Shivangi, will you be my Valentine? ❤️</h1>

<button id="yesBtn" class="yes" onclick="nextStep()">YES 💖</button>
<button id="noBtn" class="no" onmouseover="moveButton()">NO 😢</button>

<script>
let step = 1;

function moveButton() {
  const button = document.getElementById("noBtn");
  button.style.top = Math.random() * 80 + "%";
  button.style.left = Math.random() * 80 + "%";
}

function nextStep() {
  const question = document.getElementById("question");

  if(step === 1) {
    question.innerHTML = "First answer this:<br><br>Would you agree that hearts don't care about distance or time? ❤️";
    step++;
  }
  else if(step === 2) {
    question.innerHTML = "Are you sure you wanna be my Valentine for life? 💍❤️";
    step++;
  }
  else {
    celebrate();
  }
}

function celebrate() {
  document.getElementById("yesBtn").style.display = "none";
  document.getElementById("noBtn").style.display = "none";

  // Confetti hearts & emojis
  for(let i=0; i<60; i++) {
    let confetti = document.createElement("div");
    confetti.classList.add("confetti");
    confetti.innerHTML = ["❤️","💖","😊","💘"][Math.floor(Math.random()*4)];
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.animationDuration = (Math.random()*2+2) + "s";
    document.body.appendChild(confetti);
  }

  document.getElementById("question").innerHTML =
  "15 weeks until we can hold each other’s hands again. ❤️<br><br>" +
  "Feels like forever, but you’re worth the wait. 💕";
}

// Floating hearts background
for(let i=0; i<20; i++) {
  let heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (Math.random()*5+5) + "s";
  heart.style.fontSize = (Math.random()*20+15) + "px";
  document.body.appendChild(heart);
}
</script>

</body>
</html>
